spring.application.name=maxcopias
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

maxcopias.max-file-size=20MB
maxcopias.allowed-extensions=pdf,doc,docx,jpg,jpeg,png,webp

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

maxcopias.bootstrap.admin-email=${ADMIN_EMAIL:}
maxcopias.bootstrap.admin-password=${ADMIN_PASSWORD:}
maxcopias.bootstrap.worker-email=${WORKER_EMAIL:}
maxcopias.bootstrap.worker-password=${WORKER_PASSWORD:}
maxcopias.bootstrap.reset-internal-users-passwords=${RESET_INTERNAL_USERS_PASSWORDS:false}
