<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="worker-tabs worker-module-nav" th:fragment="workerNav(activeSection)" aria-label="Secciones trabajador">
    <a th:href="@{/worker}" th:classappend="${activeSection == 'resumen'} ? ' is-active' : ''">Resumen</a>
    <a th:href="@{/worker/productos}" th:classappend="${activeSection == 'productos'} ? ' is-active' : ''">Productos</a>
    <a th:href="@{/worker/pedidos-copisteria}" th:classappend="${activeSection == 'copisteria'} ? ' is-active' : ''">Pedidos copistería</a>
    <a th:href="@{/worker/pedidos-tienda}" th:classappend="${activeSection == 'tienda'} ? ' is-active' : ''">Pedidos tienda</a>
    <a th:href="@{/worker/ofertas}" th:classappend="${activeSection == 'ofertas'} ? ' is-active' : ''">Ofertas</a>
</nav>

<div th:fragment="workerDeleteModal" class="admin-confirm-modal" data-worker-delete-modal hidden>
    <div class="admin-confirm-backdrop" data-worker-delete-cancel></div>
    <section class="admin-confirm-dialog admin-confirm-dialog-danger" role="dialog" aria-modal="true" aria-labelledby="worker-delete-title">
        <span class="admin-confirm-icon admin-confirm-icon-danger">!</span>
        <h2 id="worker-delete-title">Eliminar pedido</h2>
        <p data-worker-delete-message>
            ¿Seguro que quieres eliminar este pedido? Podrás conservarlo en el historial interno.
        </p>
        <div class="admin-confirm-actions">
            <button type="button" class="button button-secondary-dark" data-worker-delete-cancel>Cancelar</button>
            <button type="button" class="button button-primary admin-danger-action" data-worker-delete-accept>Eliminar pedido</button>
        </div>
    </section>
</div>
</body>
</html>
