<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragmentos/encabezado :: head('Maxcopias | Productos trabajador', '/css/cuenta.css')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/worker.css}">
</head>
<body class="account-page worker-page">
<div class="page-shell">
    <div th:replace="~{fragmentos/navegacion :: navbar}"></div>

    <main class="worker-main">
        <section class="worker-hero">
            <div class="container worker-layout">
                <article class="worker-card">
                    <header class="worker-header worker-module-header">
                        <div>
                            <span class="section-kicker">Productos</span>
                            <h1>Productos y stock</h1>
                            <p>Gestiona el catálogo operativo: precios, stock, categorías y productos activos.</p>
                        </div>
                        <a class="button button-primary" th:href="@{/admin/crear-producto}">Crear producto</a>
                    </header>

                    <div th:replace="~{trabajador/fragmentos :: workerNav(${activeWorkerSection})}"></div>

                    <section class="worker-section table-section worker-products-admin-section">
                        <div class="admin-product-toolbar worker-products-admin-toolbar">
                            <label class="admin-product-search">
                                <span>Buscar producto</span>
                                <input id="worker-product-search" data-worker-search="productos" type="search" placeholder="Nombre, categoría o ID">
                            </label>
                            <label class="admin-product-filter">
                                <span>Filtrar categoría</span>
                                <select id="worker-product-category" data-worker-category="productos" class="admin-form-select">
                                    <option value="">Todas las categorías</option>
                                    <option th:each="categoria : ${categorias}" th:value="${categoria.nombre}" th:text="${categoria.nombre}">Escolar</option>
                                </select>
                            </label>
                        </div>

                        <div class="admin-products-table-region worker-table-wrap">
                            <table id="worker-products-table" data-worker-table="productos" data-worker-paginated="true" class="admin-table admin-products-table">
                                <thead>
                                <tr>
                                    <th class="admin-col-id">ID</th>
                                    <th class="admin-col-name">Nombre</th>
                                    <th class="admin-col-price">Precio</th>
                                    <th class="admin-col-count">Stock</th>
                                    <th class="admin-col-description">Categorías</th>
                                    <th class="admin-col-actions">Estado</th>
                                    <th class="admin-col-actions">Acción</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="producto : ${productos}"
                                    th:data-categories="${#strings.listJoin(producto.categorias.![nombre], ' ')}"
                                    th:data-status="${producto.activo} ? 'activo' : 'inactivo'">
                                    <td data-label="ID" class="admin-col-id" th:text="${producto.id}">1</td>
                                    <td data-label="Nombre" class="admin-col-name" th:text="${producto.nombre}">Cuaderno A4</td>
                                    <td data-label="Precio" class="admin-col-price" th:text="${producto.precio}">12.99</td>
                                    <td data-label="Stock" class="admin-col-count" th:text="${producto.stock}">10</td>
                                    <td data-label="Categorías" class="admin-product-categories admin-col-description">
                                        <span th:each="categoria, iter : ${producto.categorias}"
                                              th:text="${categoria.nombre + (!iter.last ? ', ' : '')}">Escolar</span>
                                    </td>
                                    <td data-label="Estado" class="admin-action-cell admin-col-actions">
                                        <span class="worker-status-pill" th:classappend="${producto.activo} ? ' is-active' : ' is-inactive'"
                                              th:text="${producto.activo} ? 'Activo' : 'Inactivo'}">Activo</span>
                                    </td>
                                    <td data-label="Acción" class="admin-action-cell admin-col-actions">
                                        <div class="worker-actions-cell worker-actions-cell-stack worker-products-admin-actions">
                                            <a class="button button-small button-outline" th:href="@{/editarstock/{id}(id=${producto.id})}">Editar</a>
                                            <form th:action="@{/worker/productos/{id}/activo(id=${producto.id})}" method="post" class="inline-form">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <input type="hidden" name="activo" th:value="${!producto.activo}">
                                                <button class="button button-small button-outline" type="submit"
                                                        th:text="${producto.activo} ? 'Desactivar' : 'Activar'}">Desactivar</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </article>
            </div>
        </section>
    </main>

    <div th:replace="~{fragmentos/pie :: footer}"></div>
</div>

<script th:src="@{/js/worker.js}"></script>
<script th:src="@{/js/inicio.js}"></script>
</body>
</html>
