<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragmentos/encabezado :: head('Maxcopias | Pedidos copisteria', '/css/cuenta.css')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/worker.css}">
</head>
<body class="account-page worker-page">
<div class="page-shell">
    <div th:replace="~{fragmentos/navegacion :: navbar}"></div>

    <main class="worker-main">
        <section class="worker-hero">
            <div class="container worker-layout">
                <article class="worker-card">
                    <header class="worker-header worker-module-header">
                        <div>
                            <span class="section-kicker">Copisteria</span>
                            <h1>Pedidos de copisteria</h1>
                            <p>Revisa archivos, codigos de recogida y actualiza el estado de cada encargo.</p>
                        </div>
                    </header>

                    <div th:replace="~{trabajador/fragmentos :: workerNav(${activeWorkerSection})}"></div>

                    <section class="worker-section">
                        <div class="worker-filters">
                            <label>
                                <span>Buscar pedido</span>
                                <input type="search" data-worker-search="copisteria" placeholder="Cliente, email, codigo o ID">
                            </label>
                            <label>
                                <span>Estado</span>
                                <select data-worker-status="copisteria" class="worker-select select-modern">
                                    <option value="">Todos los estados</option>
                                    <option th:each="estado : ${estadosCopisteria}" th:value="${estado.name()}" th:text="${estado.label}">Pendiente</option>
                                </select>
                            </label>
                            <label>
                                <span>Fecha</span>
                                <input type="date" data-worker-date="copisteria">
                            </label>
                        </div>

                        <div class="worker-table-wrap">
                            <table class="worker-table worker-table-compact" data-worker-table="copisteria" data-worker-paginated="true">
                                <thead>
                                <tr>
                                    <th>Cliente</th>
                                    <th class="worker-col-job">Trabajo</th>
                                    <th class="worker-col-file">Archivo</th>
                                    <th class="worker-col-code">Codigo</th>
                                    <th class="worker-col-status">Estado</th>
                                    <th class="worker-col-actions">Acciones</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="pedido : ${pedidosCopisteria}" th:data-status="${pedido.estado.name()}"
                                    th:data-date="${#temporals.format(pedido.fechaCreacion, 'yyyy-MM-dd')}">
                                    <td>
                                        <span class="worker-cell-title" th:text="${pedido.customerName}">Cliente</span>
                                        <small th:text="${pedido.phone}">telefono</small>
                                    </td>
                                    <td class="worker-col-job">
                                        <span class="worker-cell-title" th:text="${pedido.trabajo}">IMPRESION</span>
                                        <small th:text="${pedido.paperSize != null ? pedido.copias + ' copias · ' + pedido.paperSize.label : pedido.copias + ' copias'}">1 copia A4</small>
                                    </td>
                                    <td class="worker-col-file">
                                        <span th:if="${pedido.rutaArchivo == null}" class="worker-col-short">Sin archivo</span>
                                        <div th:if="${pedido.rutaArchivo != null}" class="worker-file-actions">
                                            <a class="button button-secondary-dark worker-file-button"
                                               th:href="@{/pedidos/copisteria/{id}/archivo(id=${pedido.id})}"
                                               target="_blank"
                                               rel="noopener noreferrer">
                                                Abrir
                                            </a>
                                        </div>
                                    </td>
                                    <td class="worker-col-code"><strong th:text="${pedido.codigoRecoger}">ABC123</strong></td>
                                    <td class="worker-col-status">
                                        <div class="worker-status-stack">
                                            <form th:action="@{/worker/copisteria/{id}/estado(id=${pedido.id})}" method="post" class="worker-status-form">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <select name="estado" class="worker-select select-modern" onchange="this.form.submit()">
                                                    <option th:each="estado : ${estadosCopisteria}"
                                                            th:value="${estado.name()}"
                                                            th:text="${estado.label}"
                                                            th:selected="${estado == pedido.estado}">Pendiente</option>
                                                </select>
                                            </form>
                                        </div>
                                    </td>
                                    <td class="worker-actions-cell worker-col-actions">
                                        <a class="button button-outline-dark"
                                           th:href="@{/worker/pedidos/{id}(id=${pedido.id},tipo='copisteria')}">
                                            Ver detalle
                                        </a>
                                        <form th:action="@{/worker/copisteria/{id}/eliminar(id=${pedido.id})}" method="post" class="worker-delete-form">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button type="button"
                                                    class="button button-outline admin-delete-btn worker-delete-trigger"
                                                    data-worker-delete-trigger
                                                    th:attr="data-worker-delete-target=@{/worker/copisteria/{id}/eliminar(id=${pedido.id})},data-worker-delete-label=${'el pedido de copisteria ' + pedido.codigoRecoger}">
                                                Eliminar
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                            <p class="worker-empty" th:if="${#lists.isEmpty(pedidosCopisteria)}">Todavia no hay pedidos de copisteria.</p>
                        </div>
                    </section>
                </article>
            </div>
        </section>
    </main>

    <div th:replace="~{trabajador/fragmentos :: workerDeleteModal}"></div>

    <div th:replace="~{fragmentos/pie :: footer}"></div>
</div>

<script th:src="@{/js/worker.js}"></script>
<script th:src="@{/js/inicio.js}"></script>
</body>
</html>
