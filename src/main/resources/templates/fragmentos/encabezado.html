<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle, extraStylesheet)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${seoDescription != null ? seoDescription : 'Copisteria y papeleria en Torrejon de Ardoz con tienda online, recogida en tienda y envio local.'}">
    <meta name="robots" th:content="${seoRobots != null ? seoRobots : 'index,follow'}">
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
    <meta th:if="${_csrf != null}" name="_csrf_parameter" th:content="${_csrf.parameterName}">
    <title th:text="${seoTitle != null ? seoTitle : pageTitle}">Maxcopias</title>
    <link rel="canonical" th:if="${seoCanonicalUrl != null}" th:href="${seoCanonicalUrl}">
    <meta property="og:locale" content="es_ES">
    <meta property="og:site_name" content="Maxcopias">
    <meta property="og:type" th:content="${seoOgType != null ? seoOgType : 'website'}">
    <meta property="og:title" th:content="${seoOgTitle != null ? seoOgTitle : (seoTitle != null ? seoTitle : pageTitle)}">
    <meta property="og:description" th:content="${seoOgDescription != null ? seoOgDescription : (seoDescription != null ? seoDescription : 'Copisteria y papeleria en Torrejon de Ardoz con tienda online, recogida en tienda y envio local.')}">
    <meta property="og:url" th:if="${seoCanonicalUrl != null}" th:content="${seoCanonicalUrl}">
    <meta property="og:image" th:if="${seoOgImageUrl != null}" th:content="${seoOgImageUrl}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" th:content="${seoOgTitle != null ? seoOgTitle : (seoTitle != null ? seoTitle : pageTitle)}">
    <meta name="twitter:description" th:content="${seoOgDescription != null ? seoOgDescription : (seoDescription != null ? seoDescription : 'Copisteria y papeleria en Torrejon de Ardoz con tienda online, recogida en tienda y envio local.')}">
    <meta name="twitter:image" th:if="${seoOgImageUrl != null}" th:content="${seoOgImageUrl}">
    <link rel="icon" type="image/png" th:href="@{/images/branding/maxcopias-favicon-mark.png(v='20260506a')}">
    <link rel="apple-touch-icon" th:href="@{/images/branding/maxcopias-logo-icon.png(v='20260506a')}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/inicio.css(v='20260511b')}">
    <link rel="stylesheet" th:if="${extraStylesheet}" th:each="sheet : ${extraStylesheet}" th:href="${sheet + '?v=20260511b'}">
    <script type="application/ld+json" th:if="${seoStructuredDataJson != null}" th:utext="${seoStructuredDataJson}"></script>
</head>

</html>
