<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="site-header" th:fragment="navbar">
    <div class="container header-shell">
        <a class="brand" th:href="@{/#inicio}" aria-label="Ir al inicio de Maxcopias">
            <img class="brand-logo brand-logo-navbar"
                 th:src="@{/images/branding/maxcopias-logo-navbar.png(v='20260506a')}"
                 alt="Maxcopias">
        </a>

        <nav class="nav-panel" id="primary-navigation" aria-label="Principal">
            <div class="nav-panel-inner">
                <div class="nav-primary-links">
                    <a th:href="@{/copisteria}" data-nav-link data-nav-match="/copisteria">
                        <span class="nav-link-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M7 8V4.8h10V8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
                                <rect x="6" y="13" width="12" height="6.2" rx="1.2" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8"/>
                                <path d="M5.3 10.2h13.4a1.8 1.8 0 0 1 1.8 1.8v3.1H18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
                            </svg>
                        </span>
                        <span>Imprimir</span>
                    </a>
                    <a th:href="@{/ofertas}"
                       class="nav-offers-link"
                       th:classappend="${navOfertaPrincipal == null} ? ' is-idle' : ' is-live'"
                       data-nav-link
                       data-nav-match="/ofertas"
                       aria-label="Ver ofertas activas de Maxcopias">
                        <span class="nav-offers-icon" aria-hidden="true">%</span>
                        <span class="nav-offers-link-text">Ofertas</span>
                    </a>
                    <a th:href="@{/tienda}" data-nav-link data-nav-match="/tienda,/detalles-producto">
                        <span class="nav-link-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="m7 16.8 9.8-9.8 2.8 2.8-9.8 9.8-4.2 1.4z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8"/>
                                <path d="m14.9 8.9 2.8 2.8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/>
                            </svg>
                        </span>
                        <span>Papeler&iacute;a</span>
                    </a>
                    <a th:href="@{/contacto}" data-nav-link data-nav-match="/contacto">
                        <span class="nav-link-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M4.5 7.5h15v9.5a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8"/>
                                <path d="m5 8 7 5 7-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
                            </svg>
                        </span>
                        <span>Contacto</span>
                    </a>
                </div>

                <div class="nav-mobile-actions">
                    <th:block sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="nav-user-menu-link" data-nav-link data-nav-match="/login">Iniciar sesión</a>
                        <a th:href="@{/register}" class="button button-outline-dark button-nav">Registrarse</a>
                    </th:block>

                    <th:block sec:authorize="hasRole('USER')">
                        <a th:href="@{/area-personal}" class="nav-user-menu-link" data-nav-link data-nav-match="/area-personal">Mi perfil</a>
                        <a th:href="@{/mis-pedidos}" class="nav-user-menu-link" data-nav-link data-nav-match="/mis-pedidos">Mis pedidos</a>
                        <form th:action="@{/logout}" method="post" class="nav-logout-form nav-logout-form-mobile">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="nav-user-menu-link nav-logout-button nav-logout-button-menu">Cerrar sesión</button>
                        </form>
                    </th:block>

                    <th:block sec:authorize="hasRole('WORKER') and !hasRole('ADMIN')">
                        <a th:href="@{/worker}" class="nav-user-menu-link" data-nav-link data-nav-match="/worker">Panel trabajador</a>
                        <form th:action="@{/logout}" method="post" class="nav-logout-form nav-logout-form-mobile">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="nav-user-menu-link nav-logout-button nav-logout-button-menu">Cerrar sesión</button>
                        </form>
                    </th:block>

                    <th:block sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/admin}" class="nav-user-menu-link" data-nav-link data-nav-match="/admin">Panel administrador</a>
                        <form th:action="@{/logout}" method="post" class="nav-logout-form nav-logout-form-mobile">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="nav-user-menu-link nav-logout-button nav-logout-button-menu">Cerrar sesión</button>
                        </form>
                    </th:block>
                </div>
            </div>
        </nav>

        <div class="nav-utility-bar">
            <a th:href="@{/carrito}"
               class="nav-icon-link nav-cart-link"
               aria-label="Ver carrito"
               data-nav-link
               data-nav-match="/carrito,/checkout,/pedido-confirmado">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 5h2l1.2 7.2a2 2 0 0 0 2 1.7h7.9a2 2 0 0 0 2-1.6L19.7 7H7.1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
                    <circle cx="9.2" cy="19" r="1.35" fill="currentColor"/>
                    <circle cx="17.2" cy="19" r="1.35" fill="currentColor"/>
                </svg>
                <span class="nav-cart-badge"
                      th:attr="data-count=${cartItemCount}"
                      th:classappend="${cartItemCount == 0} ? ' is-empty' : ''"
                      th:text="${cartItemCount}">0</span>
            </a>

            <th:block sec:authorize="isAnonymous()">
                <div class="nav-auth-actions">
                    <a th:href="@{/login}" class="nav-secondary-link" data-nav-link data-nav-match="/login">Iniciar sesión</a>
                    <a th:href="@{/register}" class="button button-outline-dark button-nav" data-nav-link data-nav-match="/register">Registrarse</a>
                </div>
            </th:block>

            <th:block sec:authorize="isAuthenticated()">
                <div class="nav-user-menu" data-user-menu>
                    <button type="button" class="nav-user-trigger" aria-expanded="false" aria-haspopup="menu" data-user-menu-trigger>
                        <span class="nav-user-avatar" th:text="${navUser != null ? navUser.avatarInitial : 'M'}">
                            M
                        </span>
                        <span class="nav-user-copy">
                            <strong th:text="${navUser != null ? navUser.displayName : 'Mi cuenta'}">Mi cuenta</strong>
                        </span>
                        <svg class="nav-user-chevron" viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M5 7.5 10 12.5 15 7.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
                        </svg>
                    </button>

                    <div class="nav-user-dropdown" role="menu" data-user-menu-dropdown>
                        <div class="nav-user-dropdown-header" th:if="${navUser != null}">
                            <span class="nav-user-avatar nav-user-avatar-large" th:text="${navUser.avatarInitial}">M</span>
                            <div class="nav-user-dropdown-copy">
                                <strong th:text="${navUser.fullName}">Ismael García</strong>
                                <small th:text="${navUser.email}">ismael@maxcopias.es</small>
                            </div>
                        </div>

                        <div class="nav-user-dropdown-section">
                            <a th:href="@{/area-personal}" class="nav-user-menu-link" role="menuitem" data-nav-link data-nav-match="/area-personal">Mi cuenta</a>
                            <a th:href="@{/mis-pedidos}" class="nav-user-menu-link" role="menuitem" data-nav-link data-nav-match="/mis-pedidos">Mis pedidos</a>
                        </div>

                        <th:block sec:authorize="hasRole('WORKER') and !hasRole('ADMIN')">
                            <div class="nav-user-dropdown-section">
                                <a th:href="@{/worker}" class="nav-user-menu-link" role="menuitem" data-nav-link data-nav-match="/worker">Panel trabajador</a>
                            </div>
                        </th:block>

                        <th:block sec:authorize="hasRole('ADMIN')">
                            <div class="nav-user-dropdown-section">
                                <a th:href="@{/admin}" class="nav-user-menu-link" role="menuitem" data-nav-link data-nav-match="/admin">Panel administrador</a>
                            </div>
                        </th:block>

                        <div class="nav-user-dropdown-section">
                            <form th:action="@{/logout}" method="post" class="nav-logout-form">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="nav-user-menu-link nav-logout-button nav-logout-button-menu" role="menuitem">Cerrar sesión</button>
                            </form>
                        </div>
                    </div>
                </div>
            </th:block>

            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" data-menu-toggle>
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>
</header>
</body>
</html>
