<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="site-header" th:fragment="navbar">
    <div class="container header-shell">
        <a class="brand" th:href="@{/#inicio}" aria-label="Ir al inicio de Maxcopias">
            <span class="brand-mark">M</span>
            <span class="brand-text">
                <strong>Maxcopias</strong>
                <small>Copisteria y papeleria</small>
            </span>
        </a>

        <nav class="nav-panel" id="primary-navigation" aria-label="Principal">
            <div class="nav-panel-inner">
                <div class="nav-primary-links">
                    <a th:href="@{/#inicio}" data-nav-link data-nav-match="/">Inicio</a>
                    <a sec:authorize="isAuthenticated()" th:href="@{/copisteria}" data-nav-link data-nav-match="/copisteria">Copisteria</a>
                    <a th:href="@{/tienda}" data-nav-link data-nav-match="/tienda,/detalles-producto">Tienda</a>
                    <a th:href="@{/contacto}" data-nav-link data-nav-match="/contacto">Contacto</a>
                </div>

                <div class="nav-mobile-actions">
                    <a th:href="@{/copisteria}" class="button button-primary nav-cta nav-cta-mobile">Encargar impresion</a>

                    <th:block sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="nav-user-menu-link" data-nav-link data-nav-match="/login">Iniciar sesion</a>
                        <a th:href="@{/register}" class="button button-outline-dark button-nav">Registrarse</a>
                    </th:block>

                    <th:block sec:authorize="hasRole('USER')">
                        <a th:href="@{/area-personal}" class="nav-user-menu-link" data-nav-link data-nav-match="/area-personal">Mi perfil</a>
                        <a th:href="@{/mis-pedidos}" class="nav-user-menu-link" data-nav-link data-nav-match="/mis-pedidos">Mis pedidos</a>
                        <form th:action="@{/logout}" method="post" class="nav-logout-form nav-logout-form-mobile">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="nav-user-menu-link nav-logout-button nav-logout-button-menu">Cerrar sesion</button>
                        </form>
                    </th:block>

                    <th:block sec:authorize="hasRole('WORKER') and !hasRole('ADMIN')">
                        <a th:href="@{/worker}" class="nav-user-menu-link" data-nav-link data-nav-match="/worker">Panel trabajador</a>
                        <form th:action="@{/logout}" method="post" class="nav-logout-form nav-logout-form-mobile">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="nav-user-menu-link nav-logout-button nav-logout-button-menu">Cerrar sesion</button>
                        </form>
                    </th:block>

                    <th:block sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/admin}" class="nav-user-menu-link" data-nav-link data-nav-match="/admin">Panel administrador</a>
                        <form th:action="@{/logout}" method="post" class="nav-logout-form nav-logout-form-mobile">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="nav-user-menu-link nav-logout-button nav-logout-button-menu">Cerrar sesion</button>
                        </form>
                    </th:block>
                </div>
            </div>
        </nav>

        <div class="nav-utility-bar">
            <a th:href="@{/copisteria}" class="button button-primary nav-cta">Encargar impresion</a>

            <a th:href="@{/carrito}"
               class="nav-icon-link nav-cart-link"
               aria-label="Ver carrito"
               data-nav-link
               data-nav-match="/carrito,/checkout,/pedido-confirmado">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 5h2l1.2 7.2a2 2 0 0 0 2 1.7h7.9a2 2 0 0 0 2-1.6L19.7 7H7.1" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
                    <circle cx="9.2" cy="19" r="1.35" fill="currentColor"/>
                    <circle cx="17.2" cy="19" r="1.35" fill="currentColor"/>
                </svg>
                <span class="nav-cart-badge"
                      th:attr="data-count=${cartItemCount}"
                      th:classappend="${cartItemCount == 0} ? ' is-empty' : ''"
                      th:text="${cartItemCount}">0</span>
            </a>

            <th:block sec:authorize="isAnonymous()">
                <div class="nav-auth-actions">
                    <a th:href="@{/login}" class="nav-secondary-link" data-nav-link data-nav-match="/login">Iniciar sesion</a>
                    <a th:href="@{/register}" class="button button-outline-dark button-nav" data-nav-link data-nav-match="/register">Registrarse</a>
                </div>
            </th:block>

            <th:block sec:authorize="isAuthenticated()">
                <div class="nav-user-menu" data-user-menu>
                    <button type="button" class="nav-user-trigger" aria-expanded="false" aria-haspopup="menu" data-user-menu-trigger>
                        <span class="nav-user-avatar">
                            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 12.2a4.1 4.1 0 1 0 0-8.2 4.1 4.1 0 0 0 0 8.2Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                                <path d="M4.5 20a7.5 7.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/>
                            </svg>
                        </span>
                        <span class="nav-user-copy">
                            <strong sec:authentication="name">usuario@maxcopias.es</strong>
                            <small>Mi cuenta</small>
                        </span>
                        <svg class="nav-user-chevron" viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M5 7.5 10 12.5 15 7.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
                        </svg>
                    </button>

                    <div class="nav-user-dropdown" role="menu" data-user-menu-dropdown>
                        <th:block sec:authorize="hasRole('USER')">
                            <a th:href="@{/area-personal}" class="nav-user-menu-link" role="menuitem" data-nav-link data-nav-match="/area-personal">Mi perfil</a>
                            <a th:href="@{/mis-pedidos}" class="nav-user-menu-link" role="menuitem" data-nav-link data-nav-match="/mis-pedidos">Mis pedidos</a>
                        </th:block>

                        <th:block sec:authorize="hasRole('WORKER') and !hasRole('ADMIN')">
                            <a th:href="@{/worker}" class="nav-user-menu-link" role="menuitem" data-nav-link data-nav-match="/worker">Panel trabajador</a>
                        </th:block>

                        <th:block sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/admin}" class="nav-user-menu-link" role="menuitem" data-nav-link data-nav-match="/admin">Panel administrador</a>
                        </th:block>

                        <form th:action="@{/logout}" method="post" class="nav-logout-form">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="nav-user-menu-link nav-logout-button nav-logout-button-menu" role="menuitem">Cerrar sesion</button>
                        </form>
                    </div>
                </div>
            </th:block>

            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" data-menu-toggle>
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>
</header>
</body>
</html>
