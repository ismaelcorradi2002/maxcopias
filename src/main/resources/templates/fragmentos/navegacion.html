<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="site-header" th:fragment="navbar">
    <div class="container header-shell">
        <a class="brand" th:href="@{/#inicio}" aria-label="Ir al inicio de Maxcopias">
            <span class="brand-mark">M</span>
            <span class="brand-text">
                <strong>Maxcopias</strong>
                <small>Copisteria y papeleria</small>
            </span>
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" data-menu-toggle>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-panel" id="primary-navigation" aria-label="Principal">
            <th:block sec:authorize="isAnonymous()">
                <a th:href="@{/#inicio}">Inicio</a>
                <a th:href="@{/tienda}">Tienda</a>
                <a th:href="@{/contacto}">Contacto</a>
                <a th:href="@{/login}" class="nav-secondary-link">Iniciar sesion</a>
                <a th:href="@{/register}" class="button button-primary button-nav">Registrarse</a>
            </th:block>

            <th:block sec:authorize="hasRole('USER')">
                <a th:href="@{/#inicio}">Inicio</a>
                <a th:href="@{/copisteria}">Copisteria</a>
                <a th:href="@{/tienda}">Tienda</a>
                <a th:href="@{/contacto}">Contacto</a>
                <a th:href="@{/mis-pedidos}">Mis pedidos</a>
                <a th:href="@{/area-personal}" class="button button-primary button-nav">Area personal</a>
                <form th:action="@{/logout}" method="post" class="nav-logout-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="nav-logout-button">Cerrar sesion</button>
                </form>
            </th:block>

            <th:block sec:authorize="hasRole('WORKER') and !hasRole('ADMIN')">
                <a th:href="@{/#inicio}">Inicio</a>
                <a th:href="@{/copisteria}">Copisteria</a>
                <a th:href="@{/tienda}">Tienda</a>
                <a th:href="@{/contacto}">Contacto</a>
                <a th:href="@{/worker}" class="button button-primary button-nav">Panel trabajador</a>
                <form th:action="@{/logout}" method="post" class="nav-logout-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="nav-logout-button">Cerrar sesion</button>
                </form>
            </th:block>

            <th:block sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/#inicio}">Inicio</a>
                <a th:href="@{/copisteria}">Copisteria</a>
                <a th:href="@{/tienda}">Tienda</a>
                <a th:href="@{/contacto}">Contacto</a>
                <a th:href="@{/admin}" class="button button-primary button-nav">Panel de administrador</a>
                <form th:action="@{/logout}" method="post" class="nav-logout-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="nav-logout-button">Cerrar sesion</button>
                </form>
            </th:block>
        </nav>
    </div>
</header>
</body>
</html>
