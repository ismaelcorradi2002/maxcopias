<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragmentos/encabezado :: head('Maxcopias | Crear categoría', '/css/cuenta.css')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/editarstock.css}">
</head>
<body class="account-page admin-page">
<div class="page-shell">
    <div th:replace="~{fragmentos/navegacion :: navbar}"></div>

    <main class="admin-main">
        <section class="admin-section">
            <div class="container admin-layout">
                <article class="dashboard-card admin-card" data-reveal="up">
                    <header class="admin-dashboard-header">
                        <div>
                            <span class="section-kicker">Administración</span>
                            <h1>Crear nueva categoría</h1>
                            <p>Completa los datos para crear una nueva categoría de productos.</p>
                        </div>
                        <span class="admin-status-pill">Nueva categoría</span>
                    </header>

                    <form th:action="@{/admin/crear-categoria}" method="post" class="admin-edit-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div th:if="${error}" class="alert alert-error" th:text="${error}">Error en formulario</div>

                        <fieldset class="admin-form-panel">
                            <legend>Datos de la categoría</legend>
                            <div class="admin-form-grid">
                                <div class="admin-form-group admin-form-group-full">
                                    <label for="nombre">Nombre <span class="required">*</span></label>
                                    <input type="text" name="nombre" id="nombre" th:value="${categoria?.nombre}" required maxlength="100">
                                </div>
                                <div class="admin-form-group admin-form-group-full">
                                    <label for="descripcion">Descripción</label>
                                    <textarea name="descripcion" id="descripcion" rows="4" th:text="${categoria?.descripcion}" maxlength="500"></textarea>
                                </div>
                            </div>
                        </fieldset>

                        <div class="admin-edit-actions">
                            <a th:href="@{/admin}" class="button button-secondary-dark">Cancelar</a>
                            <button type="submit" class="button button-primary">Crear categoría</button>
                        </div>
                    </form>

                    <div class="dashboard-actions admin-actions">
                        <a th:href="@{/admin}" class="button button-outline-dark">Volver al panel</a>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <div th:replace="~{fragmentos/pie :: footer}"></div>
</div>

<script th:src="@{/js/admin.js}"></script>
<script th:src="@{/js/inicio.js}"></script>
</body>
</html>
