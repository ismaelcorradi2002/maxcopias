<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragmentos/encabezado :: head('Maxcopias | Crear producto', '/css/cuenta.css')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/editarstock.css}">
</head>
<body class="account-page admin-page">
<div class="page-shell">
    <div th:replace="~{fragmentos/navegacion :: navbar}"></div>

    <main class="admin-main">
        <section class="admin-section">
            <div class="container admin-layout">
                <article class="dashboard-card admin-card" data-reveal="up">
                    <header class="admin-dashboard-header">
                        <div>
                            <span class="section-kicker">Administracion</span>
                            <h1>Crear nuevo producto</h1>
                            <p>
                                Completa los datos para crear un nuevo producto en la tienda.
                            </p>
                        </div>
                        <span class="admin-status-pill">Nuevo producto</span>
                    </header>

                    <form th:action="@{/admin/crear-producto}" method="post" class="admin-edit-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        
                        <div th:if="${error}">
                            <div class="alert alert-error" th:text="${error}">Error en formulario</div>
                        </div>

                        <fieldset class="admin-form-panel">
                            <legend>Datos del producto</legend>

                            <div class="admin-form-grid">
                                <div class="admin-form-group admin-form-group-full">
                                    <label for="nombre">Nombre</label>
                                    <input type="text" name="nombre" id="nombre" required maxlength="140">
                                </div>

                                <div class="admin-form-group admin-form-group-full">
                                    <label for="descripcion">Descripcion</label>
                                    <textarea name="descripcion" id="descripcion" rows="4" required maxlength="1000"></textarea>
                                </div>

                                <div class="admin-form-group">
                                    <label for="stock">Stock</label>
                                    <input type="number" name="stock" id="stock" min="0" required>
                                </div>

                                <div class="admin-form-group">
                                    <label for="precio">Precio</label>
                                    <input type="number" name="precio" id="precio" step="0.01" min="0" required>
                                </div>
                                
                                <div class="admin-form-group">
                                    <label for="categoriaId">Categoria principal <span class="required">*</span></label>
                                    <select name="categoriaId" id="categoriaId" class="admin-form-select" required>
                                        <option value="">Seleccionar (obligatorio)</option>
                                        <option th:each="cat : ${categorias}" 
                                                th:value="${cat.id}" 
                                                th:text="${cat.nombre}">
                                        </option>
                                    </select>
                                </div>

                                <div class="admin-form-group">
                                    <label for="categoriaOpcionalId">Categoria opcional</label>
                                    <select name="categoriaOpcionalId" id="categoriaOpcionalId" class="admin-form-select">
                                        <option value="">Ninguna</option>
                                        <option th:each="cat : ${categorias}" 
                                                th:value="${cat.id}" 
                                                th:text="${cat.nombre}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                        </fieldset>

                        <div class="admin-edit-actions">
                            <a th:href="@{${catalogReturnUrl}}" class="button button-secondary-dark">Cancelar</a>
                            <button type="submit" class="button button-primary">Crear producto</button>
                        </div>
                    </form>

                    <div class="dashboard-actions admin-actions">
                        <a th:href="@{${catalogReturnUrl}}" class="button button-outline-dark" th:text="${catalogReturnLabel}">Volver al panel</a>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <div th:replace="~{fragmentos/pie :: footer}"></div>
</div>

<script th:src="@{/js/admin.js}"></script>
<script th:src="@{/js/inicio.js}"></script>
</body>
</html>
