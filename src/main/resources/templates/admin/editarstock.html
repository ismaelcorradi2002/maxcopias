<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragmentos/encabezado :: head('Maxcopias | Editar stock', '/css/cuenta.css')}"/>
    <link rel="stylesheet" href="/css/editarstock.css">
</head>
<body class="account-page admin-page">
<div class="page-shell">
    <div th:replace="~{fragmentos/navegacion :: navbar}"></div>

    <main class="admin-main">
        <section class="admin-section">
            <div class="container admin-layout">
                <article class="dashboard-card admin-card" data-reveal="up">
                    <span class="section-kicker">Admin</span>
                    <h1>Editar <span th:text="${producto.nombre ?: ''}">producto</span></h1>
                    <form th:action="@{/admin/update-producto/{id}(id=${producto.id})}" th:object="${producto}" method="post" class="form-grid">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <fieldset>
                            <legend>Datos del producto</legend>
                            
                            <div class="form-group">
                                <label for="id">ID</label>
                                <input type="number" th:field="*{id}" id="id" disabled>
                            </div>
                            
                            <div class="form-group">
                                <label for="nombre">Nombre *</label>
                                <input type="text" th:field="*{nombre}" id="nombre" required maxlength="140">
                            </div>
                            
                            <div class="form-group">
                                <label for="descripcion">Descripción *</label>
                                <textarea th:field="*{descripcion}" id="descripcion" rows="4" required maxlength="1000"></textarea>
                            </div>
                            
                            <div class="form-group">
                                <label for="stock">Stock *</label>
                                <input type="number" th:field="*{stock}" id="stock" min="0" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="precio">Precio *</label>
                                <input type="number" th:field="*{precio}" id="precio" step="0.01" min="0" required>
                            </div>
                        </fieldset>
                        
                        <div class="form-actions">
                            <button type="submit" class="button button-primary">Guardar cambios</button>
                            <a th:href="@{/admin}" class="button button-secondary-dark">← Cancelar</a>
                        </div>
                    </form>
                    
                    <div class="dashboard-actions">
                        <a th:href="@{/admin}" class="button button-secondary-dark">← Volver al panel</a>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <div th:replace="~{fragmentos/pie :: footer}"></div>
</div>

<script th:src="@{/js/admin.js}"></script>
</body>
</html>
