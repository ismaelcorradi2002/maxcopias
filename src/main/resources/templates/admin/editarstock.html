<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragmentos/encabezado :: head('Maxcopias | Editar stock', '/css/cuenta.css')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/editarstock.css}">
</head>
<body class="account-page admin-page">
<div class="page-shell">
    <div th:replace="~{fragmentos/navegacion :: navbar}"></div>

    <main class="admin-main">
        <section class="admin-section">
            <div class="container admin-layout">
                <article class="dashboard-card admin-card" data-reveal="up">
                    <header class="admin-dashboard-header">
                        <div>
                            <span class="section-kicker">Administracion</span>
                            <h1>Editar stock</h1>
                            <p>
                                Actualiza los datos principales del producto
                                <strong th:text="${producto.nombre ?: 'seleccionado'}">seleccionado</strong>.
                            </p>
                        </div>
                        <span class="admin-status-pill">Producto tienda</span>
                    </header>

                    <form th:action="@{/admin/update-producto/{id}(id=${producto.id})}" th:object="${producto}" method="post" class="admin-edit-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <fieldset class="admin-form-panel">
                            <legend>Datos del producto</legend>

                            <div class="admin-form-grid">
                                <div class="admin-form-group">
                                    <label for="id">ID</label>
                                    <input type="number" th:field="*{id}" id="id" disabled>
                                </div>

                                <div class="admin-form-group">
                                    <label for="stock">Stock</label>
                                    <input type="number" th:field="*{stock}" id="stock" min="0" required>
                                </div>

                                <div class="admin-form-group admin-form-group-full">
                                    <label for="nombre">Nombre</label>
                                    <input type="text" th:field="*{nombre}" id="nombre" required maxlength="140">
                                </div>

                                <div class="admin-form-group admin-form-group-full">
                                    <label for="descripcion">Descripcion</label>
                                    <textarea th:field="*{descripcion}" id="descripcion" rows="4" required maxlength="1000"></textarea>
                                </div>

                                <div class="admin-form-group">
                                    <label for="precio">Precio</label>
                                    <input type="number" th:field="*{precio}" id="precio" step="0.01" min="0" required>
                                </div>
                            </div>
                        </fieldset>

                        <div class="admin-edit-actions">
                            <a th:href="@{/admin}" class="button button-secondary-dark">Cancelar</a>
                            <button type="submit" class="button button-primary">Guardar cambios</button>
                        </div>
                    </form>

                    <div class="dashboard-actions admin-actions">
                        <a th:href="@{/admin}" class="button button-outline-dark">Volver al panel</a>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <div th:replace="~{fragmentos/pie :: footer}"></div>
</div>

<script th:src="@{/js/admin.js}"></script>
<script th:src="@{/js/inicio.js}"></script>
</body>
</html>
