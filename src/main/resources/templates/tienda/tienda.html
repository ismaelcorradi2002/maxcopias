<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/encabezado :: head('Maxcopias | Tienda de papelería', '/css/tienda.css')}"></head>
<body class="tienda-page">
<div class="page-shell">
    <div th:replace="~{fragmentos/navegacion :: navbar}"></div>

    <main class="tienda-main">

        <!-- En oferta - Carrusel -->
        <section id="ofertas">
            <div class="container">
                <div class="section-heading">
                    <span class="section-kicker">En oferta</span>
                    <h2>Productos en promoción especial</h2>
                </div>
                <div class="oferta-carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="https://m.media-amazon.com/images/I/81p-CEe3RwL._AC_UF894,1000_QL80_.jpg" alt="[1] Cuadernos en oferta - 30% OFF">
                            <div class="carousel-overlay">
                                <h3>Cuadernos 3x2</h3>
                                <span>30% OFF</span>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="https://images-na.ssl-images-amazon.com/images/I/71+TJYgLkVL._AC_UL375_SR375,375_.jpg" alt="[2] Bolígrafos en oferta - 25% OFF">
                            <div class="carousel-overlay">
                                <h3>Pack bolígrafos</h3>
                                <span>25% OFF</span>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="https://media.cartabon.com/product/carpetas-de-gomas-tamanos-grandes-para-dibujo-800x800.jpg?width=1200" alt="[3] Carpetas en oferta - 20% OFF">
                            <div class="carousel-overlay">
                                <h3>Carpetas rígidas</h3>
                                <span>20% OFF</span>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="https://quecartucho.es/3456-large_default/papel-economico-din-a4-80-gramos-paquete-500-folios.jpg" alt="[4] Papel A4 oferta - 15% OFF">
                            <div class="carousel-overlay">
                                <h3>Papel A4 reams</h3>
                                <span>15% OFF</span>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="https://m.media-amazon.com/images/I/81yZmHtCTdL.jpg" alt="[5] Rotuladores oferta - 35% OFF">
                            <div class="carousel-overlay">
                                <h3>Rotuladores set</h3>
                                <span>35% OFF</span>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-indicators">
                        <span class="carousel-indicator active"></span>
                        <span class="carousel-indicator"></span>
                        <span class="carousel-indicator"></span>
                        <span class="carousel-indicator"></span>
                        <span class="carousel-indicator"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Secciones de productos dinámicas -->
        <section id="productos">
            <div class="container">
                <div class="section-tabs">
                    <button class="section-tab active" data-category="escolar">Escolar</button>
                    <button class="section-tab" data-category="oficina">Oficina</button>
                    <button class="section-tab" data-category="arte">Arte</button>
                    <button class="section-tab" data-category="organizacion">Organización</button>
                    <button class="section-tab" data-category="tecnologia">Tecnología</button>
                </div>

                <div class="section-heading" id="productos-title">
                    <span class="section-kicker">Todos</span>
                    <h2>Catálogo completo</h2>
                </div>

                <div class="productos-grid" id="productos-container">
                    <!-- Productos dinámicos se cargan aquí por JS -->
                </div>
            </div>
        </section>

        <section class="contact-section">
            <div class="container">
                <p><strong>Consulta disponibilidad y precios en tienda.</strong> Pase directamente por Calle Mayor 24.</p>
            </div>
        </section>
    </main>

    <div th:replace="~{fragmentos/pie :: footer}"></div>
</div>

<script th:src="@{/js/tienda.js}"></script>
</body>
</html>
