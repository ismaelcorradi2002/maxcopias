<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/encabezado :: head('Maxcopias | Tienda de papeleria', '/css/tienda.css')}"></head>
<body class="tienda-page">
<div class="page-shell">
    <div th:replace="~{fragmentos/navegacion :: navbar}"></div>

    <main class="tienda-main">
        <section id="productos">
            <div class="container">
                <div class="tienda-feedback tienda-feedback-success" th:if="${cartFeedback}" th:text="${cartFeedback}">Producto anadido al carrito.</div>
                <div class="tienda-feedback tienda-feedback-error" th:if="${cartError}" th:text="${cartError}">No se ha podido anadir el producto.</div>

                <div class="section-tabs">
                    <button class="section-tab active" data-category="todos">Todos</button>
                    <button
                        th:each="categoria : ${categoriasTienda}"
                        class="section-tab"
                        th:attr="data-category=${categoria.slug()}"
                        th:text="${categoria.nombre()}">
                        Escolar
                    </button>
                </div>

                <div class="section-heading" id="productos-title">
                    <span class="section-kicker">Todos</span>
                    <h2>Catalogo completo</h2>
                </div>

                <div class="productos-grid" id="productos-container">
                    <article
                        th:each="producto : ${productosTienda}"
                        class="mini-service-card tienda-producto-card"
                        th:attr="data-categories=${producto.categoriasSlug()},data-product-name=${producto.nombre()},data-product-price=${producto.precioFormateado()}">
                        <a class="tienda-producto-link" th:href="@{/detalles-producto/{id}(id=${producto.id()})}">
                            <img th:src="${producto.imagenUrl()}" th:alt="${producto.alt()}">
                            <div>
                                <span class="tienda-producto-categorias" th:text="${producto.categoriasTexto()}">Escolar</span>
                                <h3 th:text="${producto.nombre()}">Producto</h3>
                                <p th:text="${producto.descripcion()}">Descripcion</p>
                                <span class="tienda-offer-badge" th:if="${producto.tieneOferta()}" th:text="${producto.etiquetaOferta()}">20% OFF</span>
                                <span class="precio-tag precio-tag-offer" th:if="${producto.tieneOferta()}">
                                    <del th:text="${producto.precioOriginalFormateado()}">10,00 €</del>
                                    <strong th:text="${producto.precioOfertaFormateado()}">8,00 €</strong>
                                </span>
                                <span class="precio-tag" th:if="${!producto.tieneOferta()}" th:text="${producto.precioFormateado()}">0,00 EUR</span>
                            </div>
                        </a>
                        <div class="tienda-card-actions">
                            <span class="tienda-stock-label" th:text="${producto.stock() > 0 ? 'Stock: ' + producto.stock() : 'Sin stock'}">Stock: 0</span>
                            <form th:if="${producto.stock() > 0}" th:action="@{/carrito/anadir}" method="post" class="tienda-add-form">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="productoId" th:value="${producto.id()}">
                                <input type="hidden" name="cantidad" value="1">
                                <input type="hidden" name="redirectTo" value="/tienda">
                                <button type="submit" class="button button-primary tienda-add-button">Anadir al carrito</button>
                            </form>
                        </div>
                    </article>
                </div>
            </div>
        </section>

        <section class="contact-section">
            <div class="container">
                <p><strong>Consulta disponibilidad y precios en tienda.</strong> Pase directamente por Calle Mayor 24.</p>
            </div>
        </section>
    </main>

    <div th:replace="~{fragmentos/pie :: footer}"></div>
</div>

<script th:src="@{/js/tienda.js}"></script>
</body>
</html>
