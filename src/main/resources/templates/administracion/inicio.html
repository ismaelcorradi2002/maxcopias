<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragmentos/encabezado :: head('Maxcopias | Panel administrador', '/css/cuenta.css')}">
</head>
<link rel="stylesheet" href="/css/admin.css">

<body class="account-page admin-page">
<div class="page-shell">
    <div th:replace="~{fragmentos/navegacion :: navbar}"></div>

    <main class="admin-main">
        <section class="admin-section">
            <div class="container admin-layout">
                <article class="dashboard-card admin-card" data-reveal="up">
                    <span class="section-kicker">Admin</span>
                    <h1>Panel de administrador</h1>
                    <p>Lista completa de usuarios registrados.</p>

                    <div class="info-grid">
                        <div class="info-item">
                            <span>Usuario autenticado</span>
                            <strong th:text="${currentUsuario.fullName}">Administrador</strong>
                        </div>
                        <div class="info-item">
                            <span>Email</span>
                            <strong th:text="${currentUsuario.email}">admin@maxcopias.es</strong>
                        </div>
                    </div>

                    <div class="table-section">
                        <div class="admin-buttons">
                            <button class="button button-primary active" onclick="switchTab(this, 'users')">Usuarios</button>
                            <button class="button button-primary" onclick="switchTab(this, 'stock')">Stock</button>
                        </div>
                        <div th:if="${roleUpdated}" class="alert alert-success" style="margin-bottom: 1rem;">Rol actualizado correctamente.</div>
                        <div class="table-container">
                            <div style="text-align: center; padding: 2rem;">Cargando...</div>
                        </div>
                    </div>

                    <div class="dashboard-actions">
                        <a th:href="@{/#inicio}" class="button button-secondary-dark">Volver al inicio</a>
                        <form th:action="@{/logout}" method="post" class="inline-form">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="button button-outline-dark">Cerrar sesion</button>
                        </form>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <div th:replace="~{fragmentos/pie :: footer}"></div>
</div>



    <script th:src="@{/js/admin.js}"></script>
<script th:src="@{/js/inicio.js}"></script>
</body>
</html>
