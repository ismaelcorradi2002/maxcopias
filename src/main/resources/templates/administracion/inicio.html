<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/encabezado :: head('Maxcopias | Admin', '/css/cuenta.css')}"></head>
<body class="account-page admin-page">
<div class="page-shell">
    <div th:replace="~{fragmentos/navegacion :: navbar}"></div>

    <main class="admin-main">
        <section class="admin-section">
            <div class="container admin-layout">
                <article class="dashboard-card admin-card" data-reveal="up">
                    <span class="section-kicker">Admin</span>
                    <h1>Acceso administrativo basico</h1>
                    <p>
                        Esta pantalla existe para completar el flujo de autenticacion por roles.
                        El panel admin completo se desarrollara en su fase correspondiente.
                    </p>

                    <div class="info-grid">
                        <div class="info-item">
                            <span>Usuario autenticado</span>
                            <strong th:text="${currentUsuario.fullName}">Administrador</strong>
                        </div>
                        <div class="info-item">
                            <span>Email</span>
                            <strong th:text="${currentUsuario.email}">admin@maxcopias.es</strong>
                        </div>
                    </div>

                    <div class="dashboard-actions">
                        <a th:href="@{/#inicio}" class="button button-secondary-dark">Volver al inicio</a>
                        <form th:action="@{/logout}" method="post" class="inline-form">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="button button-outline-dark">Cerrar sesion</button>
                        </form>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <div th:replace="~{fragmentos/pie :: footer}"></div>
</div>

<script th:src="@{/js/inicio.js}"></script>
</body>
</html>
