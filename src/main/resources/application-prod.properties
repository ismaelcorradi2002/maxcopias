spring.thymeleaf.cache=false

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

app.upload.dir=${APP_UPLOAD_DIR:/tmp/maxcopias/uploads/copisteria}
maxcopias.upload-dir=${app.upload.dir}
maxcopias.product-image-upload-dir=${PRODUCT_IMAGE_UPLOAD_DIR:/tmp/maxcopias/uploads/productos}
maxcopias.offer-image-upload-dir=${OFFER_IMAGE_UPLOAD_DIR:/tmp/maxcopias/uploads/ofertas}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
