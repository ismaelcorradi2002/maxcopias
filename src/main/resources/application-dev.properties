spring.thymeleaf.cache=false
app.seed.enabled=true

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:maxcopias}?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.format_sql=true

app.upload.dir=uploads/copisteria
maxcopias.upload-dir=${app.upload.dir}
maxcopias.product-image-upload-dir=uploads/productos
maxcopias.offer-image-upload-dir=uploads/ofertas
